# aten.example.com：静态控制台 + 两个机器人 API 反代。部署时 deploy.sh 会把域名替换为实际值。
limit_req_zone $binary_remote_addr zone=aten_login:10m rate=6r/m;

server {
    listen 80;
    listen [::]:80;
    server_name aten.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name aten.example.com;

    ssl_certificate /etc/letsencrypt/live/aten.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aten.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    root /opt/aten/web/dist;
    index index.html;

    # 登录接口限流，防暴力破解（经 Cloudflare 时按边缘 IP 计，宽松但能挡住批量尝试）
    location = /ft/spot/api/v1/token/login {
        limit_req zone=aten_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:18701/api/v1/token/login;
    }

    location = /ft/futures/api/v1/token/login {
        limit_req zone=aten_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:18702/api/v1/token/login;
    }

    location /ft/spot/ {
        proxy_pass http://127.0.0.1:18701/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location /ft/futures/ {
        proxy_pass http://127.0.0.1:18702/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
